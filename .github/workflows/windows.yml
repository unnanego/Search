name: Windows

on:
  push:
    paths: ['src/**', 'test/**', 'spikes/**', '*.slnx', 'Directory.*.props', '.github/workflows/windows.yml']
  pull_request:
    paths: ['src/**', 'test/**', 'spikes/**', '*.slnx', 'Directory.*.props', '.github/workflows/windows.yml']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build Search.slnx -c Release
      - run: dotnet test test/Search.Core.Tests -c Release --no-build
